<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Maegher | COO Jewellers</title>
<meta name="description" content="A selection of stones from COO Jewellers.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Daniel Maegher | COO Jewellers">
<meta property="og:description" content="A selection of stones from COO Jewellers.">
<meta property="og:image" content="https://mrflib.github.io/coo/stones/media/logo.png">
<link rel="icon" type="image/png" href="media/logo.png">
<link rel="preload" href="media/jost.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Jost;font-style:normal;font-weight:100 900;font-display:swap;src:url(media/jost.woff2) format('woff2')}
:root{--bg:#d6d6d6;--ink:#231f20;--soft:#5d5a5b;--orange:#f0794a;--k:1}
*{box-sizing:border-box}
html{background:var(--bg);transition:background .25s}
html.white{--bg:#fff}
body{margin:0;background:var(--bg);transition:background .25s;color:var(--ink);font-family:Jost,"Century Gothic",Futura,system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:70px}
header{text-align:center;padding:36px 20px 8px}
header img{width:112px;height:112px;display:block;margin:0 auto}
header h1{font-weight:500;font-size:1.55rem;letter-spacing:.02em;margin:26px 0 6px}
header p{margin:0 auto 6px;max-width:31rem;color:var(--soft)}
main{max-width:1120px;margin:0 auto;padding:0 14px}
h2{font-weight:600;font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin:54px 0 6px}
h2::after{content:"";display:block;width:34px;height:2px;background:var(--orange);margin:12px auto 0}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin-top:10px}
.card{flex:0 0 calc(50% - 5px);min-width:0;text-align:center;padding-bottom:14px}
@media(min-width:720px){.grid{gap:14px 22px}.card{flex-basis:calc(33.333% - 15px)}}
@media(min-width:1000px){.card{flex-basis:calc(25% - 17px)}}
.media{position:relative;aspect-ratio:1/1;-webkit-tap-highlight-color:transparent}
.media.spin{cursor:pointer}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
 -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
 -webkit-mask-composite:source-in;
 mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
 mask-composite:intersect}
.media video{opacity:0;transition:opacity .25s}
.card.playing .media video{opacity:1}
.card.playing .media img{opacity:0}
.turn{position:absolute;left:7%;top:7%;margin-top:12px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.72);padding:4px 11px;border-radius:99px;pointer-events:none;white-space:nowrap}
.card.playing .turn{display:none}
.media:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.letter{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;font-size:.95rem;margin-top:2px}
.mm{margin:7px 0 0;font-weight:500;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:480px){.mm{font-size:.84rem}.turn{font-size:.58rem;padding:3px 8px}}
.note{text-align:center;color:var(--soft);margin:10px auto 0;max-width:31rem;font-size:.98rem}
.strip{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:calc(5mm*var(--k)) calc(4mm*var(--k));margin:22px auto 0;padding:0 10px;max-width:calc(120mm*var(--k))}
.strip figure{margin:0;text-align:center}
.strip svg{display:block;margin:0 auto;overflow:visible;flex:none}
.strip figcaption{font-weight:600;font-size:.8rem;margin-top:5px}
.ruler{display:block;margin:30px auto 0;overflow:visible}
.ruler text{font-family:inherit;font-weight:500;fill:var(--ink)}
.cal{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px auto 0;max-width:31rem;text-align:center;color:var(--soft);font-size:.98rem}
.cal input{width:min(320px,80vw);accent-color:var(--orange)}
.bgswitch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:9px;font:inherit;font-weight:500;font-size:.9rem;color:#fff;background:var(--ink);border:0;border-radius:99px;padding:11px 18px 11px 13px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.bgswitch i{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #fff;display:block}
html.white .bgswitch i{background:#d6d6d6}
html.white .turn{background:rgba(35,31,32,.07)}
.bgswitch:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<header>
  <img src="media/logo.png" alt="COO Hatton Garden, coojewellers.com" width="112" height="112">
  <h1>Daniel Maegher</h1>
  <p>I have tried to colour balance every photo against its background, so the colours are as close to the real stones as we can get them. Toggle white and grey backgrounds.</p>
  <p>Tap a single stone to watch it turn.</p>
</header>
<main id="main"></main>
<button class="bgswitch" id="bgswitch" type="button" aria-pressed="false"><i aria-hidden="true"></i><span>White background</span></button>
<script>
const MIX=[['round',1.37],['round',1.57],['round',1.85]];
const GROUPS=[
 {name:'Clear',tint:'#f4f4f4',items:[
  {id:'A',media:'s1',video:true,mm:'5.66 to 5.69 × 3.54 mm',sc:[['round',5.68]]},
  {id:'B',media:'m_pear',mm:'3.00 × 2.00 mm',sc:[['pear',2,3]]},
  {id:'C',media:'m_marquise',mm:'3.00 × 1.50 mm',sc:[['marquise',1.5,3]]}]},
 {name:'Blue',tint:'#8fc6e6',items:[
  {id:'D',media:'s2',video:true,mm:'4.95 to 4.99 × 3.14 mm',sc:[['round',4.97]]},
  {id:'E',media:'s3',video:true,mm:'5.18 to 5.21 × 3.29 mm',sc:[['round',5.2]]},
  {id:'F',media:'s4',video:true,mm:'5.43 to 5.44 × 3.35 mm',sc:[['round',5.44]]},
  {id:'G',media:'s5',video:true,mm:'6.66 × 4.44 × 2.50 mm',sc:[['oval',4.44,6.66]]},
  {id:'H',media:'m_blue',mm:'1.3 mm to 1.9 mm mix',sc:MIX},
  {id:'I',media:'m_blueoval',mm:'3.00 × 2.00 mm',sc:[['oval',2,3]]}]},
 {name:'Green',tint:'#b9dcc0',items:[
  {id:'J',media:'s6',video:true,mm:'3.89 × 3.85 × 2.66 mm',sc:[['cushion',3.85,3.89]]},
  {id:'K',media:'s7',video:true,mm:'5.82 × 3.63 × 2.50 mm',sc:[['pear',3.63,5.82]]},
  {id:'L',media:'m_green',mm:'1.3 mm to 1.9 mm mix',sc:MIX}]}
];
const main=document.getElementById('main');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
for(const g of GROUPS){
  main.appendChild(el('h2','',g.name));
  const grid=el('div','grid');main.appendChild(grid);
  for(const it of g.items){
    const c=el('article','card');
    c.innerHTML='<div class="media'+(it.video?' spin" role="button" tabindex="0" aria-label="Turn stone '+it.id:'')+'">'
      +'<img data-m="'+it.media+'" src="media/'+it.media+'.jpg" alt="Stone '+it.id+', '+it.mm+'" loading="lazy">'
      +(it.video?'<video muted loop playsinline preload="none" data-m="'+it.media+'" src="media/'+it.media+'.mp4"></video><span class="turn">Tap to turn</span>':'')
      +'</div><div class="letter">'+it.id+'</div><p class="mm">'+it.mm+'</p>';
    grid.appendChild(c);
    if(it.video){
      const m=c.querySelector('.media'),v=c.querySelector('video');
      const toggle=()=>{ if(v.paused){ const p=v.play(); if(p&&p.then)p.then(()=>c.classList.add('playing')).catch(()=>{}); else c.classList.add('playing'); } else v.pause(); };
      m.addEventListener('click',toggle);
      m.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
    }
  }
}

// grey or white background: the stones stay the same, only the surround changes
const sw=document.getElementById('bgswitch');let white=false;
sw.addEventListener('click',()=>{
  white=!white;const pre=white?'w_':'';
  document.documentElement.classList.toggle('white',white);
  sw.setAttribute('aria-pressed',white);sw.querySelector('span').textContent=white?'Grey background':'White background';
  document.querySelectorAll('img[data-m]').forEach(i=>{i.src='media/'+pre+i.dataset.m+'.jpg'});
  document.querySelectorAll('video[data-m]').forEach(v=>{
    const t=v.currentTime,playing=!v.paused,started=v.closest('.card').classList.contains('playing');
    v.src='media/'+pre+v.dataset.m+'.mp4';
    if(started){v.addEventListener('loadedmetadata',()=>{try{v.currentTime=t}catch(e){} if(playing){const p=v.play();if(p&&p.catch)p.catch(()=>{})}},{once:true});v.load()}
  });
});
// actual size strip, drawn in millimetres
function outline(s,tint){
  const kind=s[0],w=s[1],h=kind==='round'?s[1]:s[2],p=0.15,st='fill="'+tint+'" stroke="#231f20" stroke-width="0.12"';
  let d;
  if(kind==='round'||kind==='oval')d='<ellipse cx="'+w/2+'" cy="'+h/2+'" rx="'+w/2+'" ry="'+h/2+'" '+st+'/>';
  else if(kind==='cushion')d='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="'+w*0.3+'" '+st+'/>';
  else if(kind==='marquise')d='<path d="M'+w/2+' 0 C'+w*1.02+' '+h*0.22+' '+w*1.02+' '+h*0.78+' '+w/2+' '+h+' C'+(-w*0.02)+' '+h*0.78+' '+(-w*0.02)+' '+h*0.22+' '+w/2+' 0Z" '+st+'/>';
  else { // pear cut diamond: point at the top, full rounded shoulders, round base
    const r=w/2,by=h-r;
    d='<path d="M'+r+' 0 C'+(r+w*0.30)+' '+h*0.10+' '+w+' '+(by-h*0.30)+' '+w+' '+by+' A'+r+' '+r+' 0 0 1 0 '+by+' C0 '+(by-h*0.30)+' '+(r-w*0.30)+' '+h*0.10+' '+r+' 0Z" '+st+'/>';
  }
  return '<svg viewBox="'+(-p)+' '+(-p)+' '+(w+2*p)+' '+(h+2*p)+'" style="width:calc('+(w+2*p)+'mm*var(--k));height:calc('+(h+2*p)+'mm*var(--k))" aria-hidden="true">'+d+'</svg>';
}
main.appendChild(el('h2','','Actual size'));
const strip=el('div','strip');main.appendChild(strip);
for(const g of GROUPS)for(const it of g.items){
  const f=el('figure','','<div style="display:flex;align-items:flex-end;justify-content:center;gap:calc(0.8mm*var(--k))">'+it.sc.map(s=>outline(s,g.tint)).join('')+'</div><figcaption>'+it.id+'</figcaption>');
  strip.appendChild(f);
}
(function(){
  let t='';const L=50;
  for(let i=0;i<=L;i++){const len=i%10===0?4:(i%5===0?3:2);t+='<line x1="'+i+'" y1="0" x2="'+i+'" y2="'+len+'" stroke="#231f20" stroke-width="0.15"/>';
    if(i%10===0)t+='<text x="'+i+'" y="7.4" font-size="2.8" text-anchor="middle">'+(i/10)+'</text>'}
  t+='<line x1="0" y1="0" x2="'+L+'" y2="0" stroke="#231f20" stroke-width="0.15"/><text x="'+(L+3)+'" y="7.4" font-size="2.8">cm</text>';
  const s=el('div','','<svg class="ruler" viewBox="-2 -0.5 60 9" style="width:calc(60mm*var(--k));height:calc(9mm*var(--k))" role="img" aria-label="Ruler, 5 centimetres">'+t+'</svg>');
  main.appendChild(s);
})();
const cal=el('div','cal','<span>Hold a real ruler against the one above. If 1 cm on screen is not 1 cm, move the slider until it is, and the stones will then be shown at their real size.</span><input id="k" type="range" min="0.5" max="2" step="0.01" value="1" aria-label="Adjust the ruler to match a real ruler">');
main.appendChild(cal);
const KEY='coo-ruler-scale',k=document.getElementById('k');
function setK(v){document.documentElement.style.setProperty('--k',v)}
try{const s=parseFloat(localStorage.getItem(KEY));if(s>=0.5&&s<=2){k.value=s;setK(s)}}catch(e){}
k.addEventListener('input',()=>{setK(k.value);try{localStorage.setItem(KEY,k.value)}catch(e){}});
</script>
</body>
</html>
